name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries, OpenMPI and build tools (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
          openmpi-bin libopenmpi-dev build-essential autoconf automake libtool pkg-config
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache pinned third-party programs
        id: third-party
        uses: actions/cache@v4
        with:
          path: bin
          key: third-party-${{ runner.os }}-${{ hashFiles('packaging/third_party.json', 'packaging/build_phyml_linux.sh') }}
      - name: Fetch pinned IQ-TREE and MUSCLE (Windows)
        if: runner.os == 'Windows' && steps.third-party.outputs.cache-hit != 'true'
        run: python scripts/fetch_third_party.py --platform windows --only iqtree,muscle --dest bin
      - name: Fetch IQ-TREE, MUSCLE and build PhyML (Linux)
        if: runner.os == 'Linux' && steps.third-party.outputs.cache-hit != 'true'
        run: python scripts/fetch_third_party.py --platform linux --only iqtree,muscle,phyml --dest bin
      - name: TEMPORARY diagnosis - which test file crashes Python 3.11 at exit
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          set +e
          try() { echo "--- $1"; sh -c "$2" > /tmp/out.txt 2>&1; echo "exit=$?"; grep -a -E "Fatal|passed|failed|rror" /tmp/out.txt | head -3; }
          cat > /tmp/refs.py <<'EOF'
          import os, subprocess, sys, time
          import psutil
          child = subprocess.Popen([sys.executable, '-c', 'import time; time.sleep(30)'])
          me = psutil.Process(os.getpid())
          calls = {
              'cpu_percent()': lambda: psutil.cpu_percent(interval=None),
              'cpu_count(logical=False)': lambda: psutil.cpu_count(logical=False),
              'cpu_count(logical=True)': lambda: psutil.cpu_count(logical=True),
              'Process(pid)': lambda: psutil.Process(child.pid),
              'children(recursive)': lambda: me.children(recursive=True),
              'proc.cpu_percent': lambda: psutil.Process(child.pid).cpu_percent(interval=None),
              'is_running': lambda: psutil.Process(child.pid).is_running(),
              'status': lambda: psutil.Process(child.pid).status(),
              'pid_exists': lambda: psutil.pid_exists(child.pid),
              'wait_procs(0)': lambda: psutil.wait_procs([psutil.Process(child.pid)], timeout=0),
          }
          for name, call in calls.items():
              t0, f0 = sys.getrefcount(True), sys.getrefcount(False)
              for _ in range(200):
                  call()
              print(f'{name:28} dTrue={sys.getrefcount(True) - t0:+5} dFalse={sys.getrefcount(False) - f0:+5}')
          child.kill()
          EOF
          sed -i 's/^          //' /tmp/refs.py
          python /tmp/refs.py
          true
      - name: Tests
        run: python -m pytest -q -rs
