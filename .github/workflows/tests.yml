name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache pinned IQ-TREE and MUSCLE
        id: third-party
        uses: actions/cache@v4
        with:
          path: bin
          key: third-party-${{ hashFiles('packaging/third_party.json') }}
      - name: Fetch pinned IQ-TREE and MUSCLE
        if: steps.third-party.outputs.cache-hit != 'true'
        run: python scripts/fetch_third_party.py --dest bin
      - name: Tests
        run: python -m pytest -q -rs
