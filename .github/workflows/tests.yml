name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries, OpenMPI and build tools (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
          openmpi-bin libopenmpi-dev build-essential autoconf automake libtool pkg-config
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache pinned third-party programs
        id: third-party
        uses: actions/cache@v4
        with:
          path: bin
          key: third-party-${{ runner.os }}-${{ hashFiles('packaging/third_party.json', 'packaging/build_phyml_linux.sh') }}
      - name: Fetch pinned IQ-TREE and MUSCLE (Windows)
        if: runner.os == 'Windows' && steps.third-party.outputs.cache-hit != 'true'
        run: python scripts/fetch_third_party.py --platform windows --only iqtree,muscle --dest bin
      - name: Fetch IQ-TREE, MUSCLE and build PhyML (Linux)
        if: runner.os == 'Linux' && steps.third-party.outputs.cache-hit != 'true'
        run: python scripts/fetch_third_party.py --platform linux --only iqtree,muscle,phyml --dest bin
      - name: TEMPORARY diagnosis - which test file crashes Python 3.11 at exit
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          set +e
          try() { echo "--- $1"; sh -c "$2" > /tmp/out.txt 2>&1; echo "exit=$?"; grep -a -E "Fatal|passed|failed|rror" /tmp/out.txt | head -3; }
          cat > /tmp/refs.py <<'EOF'
          import gc, os, subprocess, sys
          import psutil
          print('psutil', psutil.__version__, sys.version)
          gc.disable()
          child = subprocess.Popen([sys.executable, '-c', 'import time; time.sleep(60)'])
          proc = psutil.Process(child.pid)
          def wait0():
              try:
                  proc.wait(timeout=0)
              except psutil.TimeoutExpired:
                  pass
          def wait_short():
              try:
                  proc.wait(timeout=0.001)
              except psutil.TimeoutExpired:
                  pass
          calls = {
              'Process.wait(timeout=0)': wait0,
              'Process.wait(timeout=0.001)': wait_short,
              'wait_procs([p], 0)': lambda: psutil.wait_procs([proc], timeout=0),
              'wait_procs([p], 0.001)': lambda: psutil.wait_procs([proc], timeout=0.001),
              'children(recursive)': lambda: psutil.Process(os.getpid()).children(recursive=True),
          }
          for name, call in calls.items():
              for n in (100, 400):
                  t0, f0 = sys.getrefcount(True), sys.getrefcount(False)
                  for _ in range(n):
                      call()
                  print(f'{name:30} n={n:4} dTrue={sys.getrefcount(True) - t0:+6} dFalse={sys.getrefcount(False) - f0:+6}')
          child.kill()
          EOF
          python /tmp/refs.py
          true
      - name: Tests
        run: python -m pytest -q -rs
