name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries, OpenMPI and build tools (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
          openmpi-bin libopenmpi-dev build-essential autoconf automake libtool pkg-config
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache pinned third-party programs
        id: third-party
        uses: actions/cache@v4
        with:
          path: bin
          key: third-party-${{ runner.os }}-${{ hashFiles('packaging/third_party.json', 'packaging/build_phyml_linux.sh') }}
      - name: Fetch pinned IQ-TREE and MUSCLE (Windows)
        if: runner.os == 'Windows' && steps.third-party.outputs.cache-hit != 'true'
        run: python scripts/fetch_third_party.py --platform windows --only iqtree,muscle --dest bin
      - name: Fetch IQ-TREE, MUSCLE and build PhyML (Linux)
        if: runner.os == 'Linux' && steps.third-party.outputs.cache-hit != 'true'
        run: python scripts/fetch_third_party.py --platform linux --only iqtree,muscle,phyml --dest bin
      - name: TEMPORARY diagnosis - which test file crashes Python 3.11 at exit
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          set +e
          try() { echo "--- $1"; sh -c "$2" > /tmp/out.txt 2>&1; echo "exit=$?"; grep -a -E "Fatal|passed|failed|rror" /tmp/out.txt | head -3; }
          try core 'python -c "import PySide6.QtCore"'
          try widgets 'python -c "from PySide6.QtWidgets import QApplication; app = QApplication([])"'
          try mpl 'python -c "import matplotlib; matplotlib.use(\"QtAgg\"); import matplotlib.pyplot"'
          try pytest-empty 'python -m pytest -q -p no:cacheprovider tests/unit/test_release_meta.py'
          try pytest-noqt 'python -m pytest -q -p no:cacheprovider -p no:pytest-qt tests/unit/test_release_meta.py'
          try pytest-noqt-noconftest 'python -m pytest -q -p no:cacheprovider -p no:pytest-qt --noconftest tests/unit/test_release_meta.py'
          try import-core 'python -c "import phyml_core.runner, phyml_core.engines.phyml"'
          try import-ui 'python -c "import phyml_ui.main_window"'
          try psutil 'python -c "import psutil; psutil.cpu_count(logical=False)"'
          try bio 'python -c "from Bio import Phylo, SeqIO"'
          true
      - name: Tests
        run: python -m pytest -q -rs
